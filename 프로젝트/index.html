<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방 1차 통제선 스캐너 (FirePass)</title>
  
  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#991b1b">

  <!-- UI & 라이브러리 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    /* 카메라 스캔 박스 커스텀 */
    #reader video {
      object-fit: cover !important;
      border-radius: 12px;
    }
    #reader {
      border: none !important;
    }
  </style>
</head>
<body class="bg-gray-950 text-white flex flex-col h-screen select-none overflow-hidden font-sans">

  <!-- 1. 상단 바 -->
  <header class="p-3 bg-red-900 flex justify-between items-center shadow-lg border-b border-red-800">
    <div class="flex items-center gap-2">
      <span class="text-xl">🚒</span>
      <div>
        <h1 class="font-extrabold text-base tracking-tight leading-none">1차 통제선 현장 스캐너</h1>
        <div class="flex items-center gap-2 mt-1">
          <span id="networkStatus" class="text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-300 font-medium">● 온라인</span>
          <span id="unsyncedBadge" class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-300 font-medium">동기화 대기: 0건</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleTorch()" id="btnTorch" class="p-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm border border-gray-700" title="플래시">🔦</button>
      <button onclick="showConfigPrompt()" class="p-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm border border-gray-700" title="설정">⚙️</button>
      <a href="dashboard.html" class="p-2 bg-blue-700 hover:bg-blue-600 rounded-lg text-sm font-bold" title="관제 대시보드">📊</a>
    </div>
  </header>

  <!-- 2. 진입 / 철수 대형 선택 바 (소방장갑 착용 배려 대형 터치 영역) -->
  <div class="grid grid-cols-2 gap-2 p-2 bg-gray-900 border-b border-gray-800">
    <button id="btnModeEntry" onclick="setScanMode('ENTRY')" 
            class="py-4 text-xl font-black rounded-xl bg-green-600 border-4 border-white shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
      <span>진입 (ENTER)</span>
    </button>
    <button id="btnModeExit" onclick="setScanMode('EXIT')" 
            class="py-4 text-xl font-black rounded-xl bg-gray-800 text-gray-400 border-4 border-transparent shadow flex items-center justify-center gap-2 active:scale-95 transition">
      <span>철수 (EXIT)</span>
    </button>
  </div>

  <!-- 3. 카메라 QR 스캔 영역 -->
  <main class="flex-1 relative bg-black flex flex-col justify-center items-center overflow-hidden">
    <div id="reader" class="w-full h-full max-w-md"></div>

    <!-- 스캔 조준 가이드 오버레이 -->
    <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
      <div class="w-64 h-64 border-2 border-red-500/50 rounded-2xl relative">
        <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-red-500 rounded-tl"></div>
        <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-red-500 rounded-tr"></div>
        <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-red-500 rounded-bl"></div>
        <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-red-500 rounded-br"></div>
      </div>
      <p class="text-xs text-gray-400 mt-4 bg-black/60 px-3 py-1 rounded-full">대원 헬멧의 QR코드를 프레임에 맞춰주세요</p>
    </div>

    <!-- 스캔 결과 토스트 알림 (즉시 피드백) -->
    <div id="scanResultToast" class="absolute bottom-4 left-4 right-4 p-4 rounded-2xl shadow-2xl text-center transform transition-all duration-300 translate-y-32 opacity-0 pointer-events-none">
      <div id="toastAction" class="text-xs font-bold uppercase tracking-wider text-white/80"></div>
      <div id="toastName" class="text-2xl font-black mt-0.5"></div>
      <div id="toastDetail" class="text-xs text-white/90 mt-1"></div>
    </div>
  </main>

  <!-- 4. 하단 최근 태깅 내역 및 수동 입력 바 -->
  <footer class="bg-gray-900 border-t border-gray-800 p-2 flex flex-col gap-2">
    <div class="flex justify-between items-center px-1">
      <span class="text-xs font-bold text-gray-400">현장 최근 태그 내역</span>
      <button onclick="triggerSync()" class="text-xs text-blue-400 hover:underline flex items-center gap-1">
        <span>🔄 즉시 동기화</span>
      </button>
    </div>
    
    <div id="recentTagsList" class="flex gap-2 overflow-x-auto pb-1 max-h-16 text-xs">
      <div class="text-gray-500 italic p-2">최근 태깅 내역이 없습니다.</div>
    </div>

    <div class="grid grid-cols-2 gap-2 mt-1">
      <button onclick="openManualEntryModal()" class="py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl border border-gray-700 flex items-center justify-center gap-1">
        <span>🔍 QR 훼손 수동 검색</span>
      </button>
      <button onclick="window.location.href='admin.html'" class="py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl border border-gray-700 flex items-center justify-center gap-1">
        <span>🪪 대원/QR 관리</span>
      </button>
    </div>
  </footer>

  <!-- 5. QR 미인식 대비 수동 검색 모달 -->
  <div id="manualModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end p-0">
    <div class="bg-gray-900 w-full rounded-t-3xl p-5 border-t border-gray-700 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-extrabold text-lg text-white">대원 수동 출입 처리</h3>
        <button onclick="closeManualEntryModal()" class="text-gray-400 text-2xl font-bold p-1">✕</button>
      </div>
      <p class="text-xs text-gray-400 mb-3">QR 코드가 그을음 등으로 오염된 경우 대원 이름으로 검색하세요.</p>
      
      <input type="text" id="manualSearchInput" oninput="filterFirefighters(this.value)" placeholder="대원 이름 검색 (예: 홍길동)" 
             class="w-full p-3 bg-gray-800 border border-gray-700 rounded-xl text-white mb-3 focus:outline-none focus:border-red-500" />
      
      <div id="firefighterSearchResults" class="flex-1 overflow-y-auto space-y-2 mb-3 max-h-60">
        <!-- 검색 결과가 여기에 렌더링됩니다 -->
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 상태 및 로컬 DB 초기화 (IndexedDB Dexie)
    // ==========================================
    let currentScanMode = 'ENTRY'; // 'ENTRY' or 'EXIT'
    let html5QrCode = null;
    let isTorchOn = false;
    let wakeLock = null;

    const db = new Dexie('FirePassDB');
    db.version(1).stores({
      firefighters: 'qr_token, id, service_number, name, rank, team_name',
      pendingLogs: 'id, scene_id, firefighter_id, qr_token, action_type, tagged_at, is_manual, is_synced'
    });

    // config.js 누락 대비 자체 내장 접속 정보
    const EMBEDDED_SUPABASE_URL = "https://pnrlxmikvglfbipkootb.supabase.co";
    const EMBEDDED_SUPABASE_KEY = "sb_publishable_wu1okv3-NmPDXcoeGRjalQ_9-fiswGc";

    function getSafeSupabaseClient() {
      if (typeof getSupabaseClient === 'function') {
        const c = getSupabaseClient();
        if (c) return c;
      }
      if (typeof supabase !== 'undefined' && supabase.createClient) {
        return supabase.createClient(EMBEDDED_SUPABASE_URL, EMBEDDED_SUPABASE_KEY);
      }
      return null;
    }

    const supabaseClient = getSafeSupabaseClient();

    // ==========================================
    // 2. 사운드 및 진동 피드백 (AudioContext)
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type = 'success') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      if (type === 'success') {
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // ==========================================
    // 3. 화면 꺼짐 방지 (Wake Lock API)
    // ==========================================
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Screen Wake Lock 활성화됨');
        } catch (err) {
          console.warn('Wake Lock 오류:', err);
        }
      }
    }

    // ==========================================
    // 4. 모드 전환 (진입 / 철수)
    // ==========================================
    function setScanMode(mode) {
      currentScanMode = mode;
      const btnEntry = document.getElementById('btnModeEntry');
      const btnExit = document.getElementById('btnModeExit');

      if (mode === 'ENTRY') {
        btnEntry.className = "py-4 text-xl font-black rounded-xl bg-green-600 border-4 border-white shadow-lg flex items-center justify-center gap-2 active:scale-95 transition";
        btnExit.className = "py-4 text-xl font-black rounded-xl bg-gray-800 text-gray-400 border-4 border-transparent shadow flex items-center justify-center gap-2 active:scale-95 transition";
      } else {
        btnEntry.className = "py-4 text-xl font-black rounded-xl bg-gray-800 text-gray-400 border-4 border-transparent shadow flex items-center justify-center gap-2 active:scale-95 transition";
        btnExit.className = "py-4 text-xl font-black rounded-xl bg-red-600 border-4 border-white shadow-lg flex items-center justify-center gap-2 active:scale-95 transition";
      }
    }

    // ==========================================
    // 5. 핵심 스캔 처리 루틴 (0초 딜레이 오프라인 로컬 우선)
    // ==========================================
    let lastScannedToken = null;
    let lastScannedTime = 0;

    async function handleScanToken(token, isManual = false) {
      const now = Date.now();
      // 동일 QR코드 연속 스캔 방지 (2.5초 쿨다운)
      if (!isManual && token === lastScannedToken && (now - lastScannedTime) < 2500) {
        return;
      }
      lastScannedToken = token;
      lastScannedTime = now;

      // 1) 로컬 캐시에서 대원 정보 조회
      let member = await db.firefighters.get(token);
      
      // 2) 출입 로그 레코드 생성
      const logRecord = {
        id: crypto.randomUUID(),
        scene_id: DEFAULT_SCENE_ID,
        firefighter_id: member ? member.id : null,
        qr_token: token,
        action_type: currentScanMode,
        tagged_at: new Date().toISOString(),
        is_manual: isManual,
        is_synced: 0
      };

      // 3) 로컬 DB(IndexedDB)에 즉시 저장
      await db.pendingLogs.add(logRecord);

      // 4) UI 피드백 및 사운드
      playBeep(currentScanMode === 'ENTRY' ? 'success' : 'exit');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      
      const displayName = member ? `${member.team_name} ${member.rank} ${member.name}` : `미등록 (${token.substring(0, 12)}...)`;
      showResultToast(displayName, currentScanMode);
      addRecentTagCard(displayName, currentScanMode, new Date());
      updateUnsyncedCount();

      // 5) 온라인 상태라면 즉시 백그라운드 클라우드 전송
      if (navigator.onLine && supabaseClient) {
        triggerSync();
      }
    }

    function showResultToast(title, mode) {
      const toast = document.getElementById('scanResultToast');
      const actionEl = document.getElementById('toastAction');
      const nameEl = document.getElementById('toastName');
      const detailEl = document.getElementById('toastDetail');

      const isEntry = mode === 'ENTRY';
      toast.className = `absolute bottom-6 left-4 right-4 p-5 rounded-2xl shadow-2xl text-center transform transition-all duration-300 translate-y-0 opacity-100 z-40 ${isEntry ? 'bg-green-600' : 'bg-red-600'}`;
      actionEl.innerText = isEntry ? "✔ 진입 완료 (ENTRY)" : "✔ 철수 완료 (EXIT)";
      nameEl.innerText = title;
      detailEl.innerText = `기록 시각: ${new Date().toLocaleTimeString()}`;

      setTimeout(() => {
        toast.className = "absolute bottom-6 left-4 right-4 p-5 rounded-2xl shadow-2xl text-center transform transition-all duration-300 translate-y-32 opacity-0 pointer-events-none";
      }, 2500);
    }

    function addRecentTagCard(title, mode, time) {
      const list = document.getElementById('recentTagsList');
      if (list.querySelector('.italic')) list.innerHTML = '';

      const isEntry = mode === 'ENTRY';
      const card = document.createElement('div');
      card.className = `px-3 py-1.5 rounded-lg shrink-0 flex items-center gap-1.5 ${isEntry ? 'bg-green-950 text-green-300 border border-green-800' : 'bg-red-950 text-red-300 border border-red-800'}`;
      card.innerHTML = `<span class="font-bold">[${isEntry ? '진입' : '철수'}]</span> <span>${title}</span> <span class="text-[10px] opacity-75">${time.toLocaleTimeString()}</span>`;
      
      list.prepend(card);
      if (list.children.length > 10) list.removeChild(list.lastChild);
    }

    // ==========================================
    // 6. Supabase 클라우드 동기화 매니저
    // ==========================================
    async function triggerSync() {
      if (!supabaseClient || !navigator.onLine) return;

      const unsynced = await db.pendingLogs.where('is_synced').equals(0).toArray();
      if (unsynced.length === 0) return;

      for (const item of unsynced) {
        try {
          const { error } = await supabaseClient.from('entry_exit_logs').upsert({
            id: item.id,
            scene_id: item.scene_id,
            firefighter_id: item.firefighter_id,
            qr_token: item.qr_token,
            action_type: item.action_type,
            tagged_at: item.tagged_at,
            is_manual: item.is_manual
          });

          if (!error) {
            await db.pendingLogs.update(item.id, { is_synced: 1 });
          } else {
            console.error('동기화 실패 항목:', error);
          }
        } catch (e) {
          console.warn('동기화 중 통신 단절:', e);
          break;
        }
      }
      updateUnsyncedCount();
    }

    async function updateUnsyncedCount() {
      const count = await db.pendingLogs.where('is_synced').equals(0).count();
      const badge = document.getElementById('unsyncedBadge');
      badge.innerText = `동기화 대기: ${count}건`;
      badge.className = count > 0 
        ? "text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-300 font-bold"
        : "text-xs px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 font-medium";
    }

    // ==========================================
    // 7. 대원 마스터 로컬 캐시 동기화
    // ==========================================
    async function syncFirefightersCache() {
      if (!supabaseClient || !navigator.onLine) return;
      try {
        const { data, error } = await supabaseClient.from('firefighters').select('*');
        if (data && !error) {
          await db.firefighters.bulkPut(data);
          console.log(`대원 ${data.length}명 로컬 캐싱 완료`);
        }
      } catch (err) {
        console.warn('대원 캐싱 실패 (오프라인 상태 유지):', err);
      }
    }

    // ==========================================
    // 8. 수동 대원 검색 모달 로직
    // ==========================================
    function openManualEntryModal() {
      document.getElementById('manualModal').classList.remove('hidden');
      filterFirefighters('');
    }
    function closeManualEntryModal() {
      document.getElementById('manualModal').classList.add('hidden');
    }

    async function filterFirefighters(keyword) {
      const resultsContainer = document.getElementById('firefighterSearchResults');
      const allMembers = await db.firefighters.toArray();
      const term = keyword.trim().toLowerCase();

      const filtered = allMembers.filter(m => 
        m.name.toLowerCase().includes(term) || 
        m.team_name.toLowerCase().includes(term)
      );

      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<div class="p-3 text-center text-gray-500 text-sm">일치하는 대원이 없습니다.</div>';
        return;
      }

      resultsContainer.innerHTML = filtered.map(m => `
        <div class="p-3 bg-gray-800 rounded-xl flex justify-between items-center border border-gray-700">
          <div>
            <div class="font-bold text-white">${m.rank} ${m.name}</div>
            <div class="text-xs text-red-400">${m.team_name}</div>
          </div>
          <button onclick="handleManualSelect('${m.qr_token}')" class="px-4 py-2 bg-red-600 hover:bg-red-500 font-bold rounded-lg text-sm">
            ${currentScanMode === 'ENTRY' ? '진입' : '철수'} 처리
          </button>
        </div>
      `).join('');
    }

    function handleManualSelect(token) {
      closeManualEntryModal();
      handleScanToken(token, true);
    }

    // ==========================================
    // 9. 카메라 플래시 토글
    // ==========================================
    function toggleTorch() {
      if (html5QrCode) {
        isTorchOn = !isTorchOn;
        html5QrCode.applyVideoConstraints({
          advanced: [{ torch: isTorchOn }]
        }).then(() => {
          document.getElementById('btnTorch').innerText = isTorchOn ? '🔦 ON' : '🔦';
        }).catch(err => alert("플래시를 지원하지 않는 기기이거나 권한이 필요합니다."));
      }
    }

    // ==========================================
    // 10. 초기 구동 및 카메라 시작
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      requestWakeLock();
      checkConfigModal();
      await syncFirefightersCache();
      updateUnsyncedCount();

      // 네트워크 상태 모니터링
      window.addEventListener('online', () => {
        document.getElementById('networkStatus').innerText = '● 온라인';
        document.getElementById('networkStatus').className = 'text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-300 font-medium';
        triggerSync();
        syncFirefightersCache();
      });
      window.addEventListener('offline', () => {
        document.getElementById('networkStatus').innerText = '○ 오프라인 (로컬저장)';
        document.getElementById('networkStatus').className = 'text-xs px-2 py-0.5 rounded-full bg-red-500/20 text-red-300 font-medium';
      });

      // 카메라 스캐너 시작
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { 
          fps: 20, 
          qrbox: (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return { width: Math.floor(minEdge * 0.75), height: Math.floor(minEdge * 0.75) };
          }
        },
        (decodedText) => handleScanToken(decodedText, false),
        (errorMessage) => {} // 스캔 중 오류는 무시
      ).catch(err => {
        console.warn("카메라 권한 필요:", err);
      });

      // 서비스 워커 등록 (PWA 오프라인 지원)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW 실패:', err));
      }
    });
  </script>
</body>
</html>
